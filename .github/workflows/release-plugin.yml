name: Release Plugin

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.parse.outputs.name }}
      version: ${{ steps.parse.outputs.version }}
      interface: ${{ steps.detect.outputs.interface }}
      has_native_libs: ${{ steps.native_libs.outputs.has_native_libs }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Split on last occurrence of -v to get name and version
          NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed tag: name=$NAME version=$VERSION"

      - name: Detect plugin interface
        id: detect
        run: |
          PLUGIN_JSON="${{ steps.parse.outputs.name }}/plugin.json"
          if [[ ! -f "$PLUGIN_JSON" ]]; then
            echo "ERROR: $PLUGIN_JSON not found" >&2
            exit 1
          fi
          INTERFACE=$(python3 -c "import json; print(json.load(open('$PLUGIN_JSON'))['interface'])")
          echo "interface=$INTERFACE" >> "$GITHUB_OUTPUT"
          echo "Detected interface: $INTERFACE"

      - name: Detect bundled native libs
        id: native_libs
        run: |
          PLUGIN_JSON="${{ steps.parse.outputs.name }}/plugin.json"
          HAS_NATIVE=$(python3 -c "import json; d=json.load(open('$PLUGIN_JSON')); print('true' if d.get('bundled_libs') else 'false')")
          echo "has_native_libs=$HAS_NATIVE" >> "$GITHUB_OUTPUT"
          echo "Has native libs: $HAS_NATIVE"

  build-cli:
    needs: detect
    if: needs.detect.outputs.interface == 'cli' && needs.detect.outputs.has_native_libs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package CLI plugin
        run: ./package.sh ${{ needs.detect.outputs.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-cli
          path: dist/*.tar.gz

  build-native:
    needs: detect
    if: needs.detect.outputs.interface == 'native'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-latest
            platform: darwin-aarch64
          - runner: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.platform == 'windows-x86_64' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout uniconv core (for plugin_api.h)
        uses: actions/checkout@v4
        with:
          repository: uniconv/uniconv
          path: uniconv

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows-x86_64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-poppler

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config patchelf \
            libvips-dev \
            libcairo2-dev libpoppler-glib-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libavfilter-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install pkg-config vips cairo poppler ffmpeg

      - name: Build native plugin (Unix)
        if: matrix.platform != 'windows-x86_64'
        run: |
          cd ${{ needs.detect.outputs.name }}
          mkdir -p build && cd build
          cmake \
            -DUNICONV_INCLUDE_DIR=${{ github.workspace }}/uniconv/include \
            ..
          cmake --build .

      - name: Build native plugin (Windows)
        if: matrix.platform == 'windows-x86_64'
        run: |
          cd ${{ needs.detect.outputs.name }}
          mkdir -p build && cd build
          cmake -G "MinGW Makefiles" \
            -DUNICONV_INCLUDE_DIR="$(cygpath -u '${{ github.workspace }}')/uniconv/include" \
            ..
          cmake --build .

      - name: Package native plugin
        run: PLATFORM=${{ matrix.platform }} ./package.sh ${{ needs.detect.outputs.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}
          path: dist/*.tar.gz

  build-cli-native:
    needs: detect
    if: needs.detect.outputs.interface == 'cli' && needs.detect.outputs.has_native_libs == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-latest
            platform: darwin-aarch64
          - runner: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.platform == 'windows-x86_64' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows-x86_64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-zbar
            mingw-w64-x86_64-pkg-config

      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y pkg-config patchelf libzbar-dev

      - name: Install native deps (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install pkg-config zbar

      - name: Package
        run: PLATFORM=${{ matrix.platform }} ./package.sh ${{ needs.detect.outputs.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}
          path: dist/*.tar.gz

  release:
    needs: [detect, build-cli, build-native, build-cli-native]
    if: always() && (needs.build-cli.result == 'success' || needs.build-native.result == 'success' || needs.build-cli-native.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.detect.outputs.name }} v${{ needs.detect.outputs.version }}
          files: |
            artifacts/*.tar.gz
            artifacts/checksums-sha256.txt

      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Update manifest SHA256
        run: |
          NAME="${{ needs.detect.outputs.name }}"
          VERSION="${{ needs.detect.outputs.version }}"

          python3 -c "
          import json, sys

          name = sys.argv[1]
          version = sys.argv[2]

          checksums = {}
          with open('artifacts/checksums-sha256.txt') as f:
              for line in f:
                  parts = line.strip().split()
                  if len(parts) == 2:
                      checksums[parts[1]] = parts[0]

          manifest_path = f'repo/{name}/manifest.json'
          with open(manifest_path) as f:
              manifest = json.load(f)

          for release in manifest['releases']:
              if release['version'] == version:
                  for platform_key, artifact in release['artifact'].items():
                      url = artifact['url']
                      filename = url.rsplit('/', 1)[-1]
                      if filename in checksums:
                          artifact['sha256'] = checksums[filename]
                          print(f'  {platform_key}: {checksums[filename]}')
                  break

          with open(manifest_path, 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          " "$NAME" "$VERSION"

      - name: Commit and push manifest update
        run: |
          cd repo
          NAME="${{ needs.detect.outputs.name }}"
          VERSION="${{ needs.detect.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$NAME/manifest.json"
          git diff --cached --quiet && echo 'No changes to commit' || \
            (git commit -m "chore($NAME): update SHA256 for v$VERSION" && git push)
